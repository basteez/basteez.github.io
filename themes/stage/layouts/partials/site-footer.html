{{- $since := site.Params.footer.since -}}
{{- $now := now.Year -}}
<footer class="site-footer">
  <div class="site-footer__inner">
    <p class="site-footer__copy">
      &copy; {{ if and $since (ne (int $since) $now) }}{{ $since }}&ndash;{{ end }}{{ $now }} {{ site.Copyright }}
    </p>
    {{- with site.Params.footer.customText }}
    <p class="site-footer__note">{{ . | safeHTML }}</p>
    {{- end }}
    <p class="site-footer__built">Built with <a href="https://gohugo.io/">Hugo</a>. <a href="{{ "index.xml" | relURL }}">RSS</a></p>
  </div>
</footer>
