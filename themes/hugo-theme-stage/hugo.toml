# Theme configuration. Site settings belong in your own hugo.toml (see exampleSite/hugo.toml).
# Theme defaults are resolved in layouts/_partials/stage/config.html, not here, so that the
# older parameter names some sites still use (article.toc, footer.since, ...) keep working.

[module]
  [module.hugoVersion]
    min = "0.146.0"
