{{ if .Store.Get "hasMermaid" }}
    <style>
        .mermaid-figure { margin: 1.5rem 0; text-align: center; }
        .mermaid { cursor: zoom-in; }
        .mermaid svg { max-width: 100%; height: auto; }
        .mermaid-caption {
            margin-top: .5rem;
            font-size: .85rem;
            opacity: .6;
            user-select: none;
        }
        .mermaid-modal {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            box-sizing: border-box;
            background: rgba(0, 0, 0, .8);
            cursor: zoom-out;
        }
        .mermaid-modal.open { display: flex; }
        .mermaid-modal__body {
            width: 95%;
            height: 90%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            box-sizing: border-box;
            background: #fff;
            border-radius: 10px;
        }
        .mermaid-modal__body svg {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
        }
        .mermaid-modal__close {
            position: fixed;
            top: 1rem;
            right: 1.25rem;
            padding: .45rem .9rem;
            font: inherit;
            font-size: .9rem;
            color: #000;
            background: #fff;
            border: 2px solid #000;
            cursor: pointer;
        }
        .mermaid-modal__close:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
        .mermaid-zoom {
            padding: .35rem .8rem;
            font: inherit;
            font-size: .85rem;
            color: #fff;
            background: #000;
            border: 2px solid #000;
            cursor: zoom-in;
        }
        .mermaid-zoom:hover { background: #e60012; }
    </style>
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.esm.min.mjs';
        mermaid.initialize({ startOnLoad: false });
        await mermaid.run();

        // Enlarged view: a real dialog with a close button, Esc, and focus returned to where it came from.
        const modal = document.createElement('div');
        modal.className = 'mermaid-modal';
        modal.setAttribute('role', 'dialog');
        modal.setAttribute('aria-modal', 'true');
        modal.setAttribute('aria-label', 'Enlarged diagram');
        modal.innerHTML =
            '<button type="button" class="mermaid-modal__close">Close <span aria-hidden="true">✕</span></button>' +
            '<div class="mermaid-modal__body"></div>';
        document.body.appendChild(modal);
        const body = modal.querySelector('.mermaid-modal__body');
        const closeBtn = modal.querySelector('.mermaid-modal__close');
        let opener = null;

        const close = () => {
            if (!modal.classList.contains('open')) return;
            modal.classList.remove('open');
            body.innerHTML = '';
            if (opener) opener.focus();
        };
        const open = (el, from) => {
            const svg = el.querySelector('svg');
            if (!svg) return;
            const clone = svg.cloneNode(true);
            clone.removeAttribute('style');
            clone.removeAttribute('width');
            clone.removeAttribute('height');
            clone.removeAttribute('id');
            body.innerHTML = '';
            body.appendChild(clone);
            opener = from;
            modal.classList.add('open');
            closeBtn.focus();
        };
        modal.addEventListener('click', (e) => { if (e.target !== closeBtn) close(); });
        closeBtn.addEventListener('click', close);
        document.addEventListener('keydown', (e) => {
            if (!modal.classList.contains('open')) return;
            if (e.key === 'Escape') close();
            if (e.key === 'Tab') { e.preventDefault(); closeBtn.focus(); } // the close button is the only stop
        });

        document.querySelectorAll('.mermaid-figure').forEach((fig) => {
            const el = fig.querySelector('.mermaid');
            const cap = fig.querySelector('.mermaid-caption');
            if (!el) return;
            el.addEventListener('click', () => open(el, btn));
            // Keyboard and screen-reader users get a real button in the caption.
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'mermaid-zoom';
            btn.textContent = 'Enlarge diagram';
            btn.addEventListener('click', () => open(el, btn));
            if (cap) cap.replaceChildren(btn); else fig.appendChild(btn);
        });
    </script>
{{ end }}
