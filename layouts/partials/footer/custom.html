{{ if .Store.Get "hasMermaid" }}
    <style>
        .mermaid-figure { margin: 1.5rem 0; text-align: center; }
        .mermaid { cursor: zoom-in; }
        .mermaid svg { max-width: 100%; height: auto; }
        .mermaid-caption {
            margin-top: .5rem;
            font-size: .85rem;
            opacity: .6;
            user-select: none;
        }
        .mermaid-modal {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            box-sizing: border-box;
            background: rgba(0, 0, 0, .8);
            cursor: zoom-out;
        }
        .mermaid-modal.open { display: flex; }
        .mermaid-modal__body {
            width: 95%;
            height: 90%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            box-sizing: border-box;
            background: #fff;
            border-radius: 10px;
        }
        .mermaid-modal__body svg {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
        }
        .mermaid-modal__hint {
            position: fixed;
            top: 1rem;
            right: 1.25rem;
            color: #fff;
            font-size: .85rem;
            opacity: .75;
            user-select: none;
        }
    </style>
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.esm.min.mjs';
        mermaid.initialize({ startOnLoad: false });
        await mermaid.run();

        const modal = document.createElement('div');
        modal.className = 'mermaid-modal';
        modal.innerHTML =
            '<span class="mermaid-modal__hint">click anywhere or press Esc to close</span>' +
            '<div class="mermaid-modal__body"></div>';
        document.body.appendChild(modal);
        const body = modal.querySelector('.mermaid-modal__body');

        const close = () => {
            modal.classList.remove('open');
            body.innerHTML = '';
        };
        modal.addEventListener('click', close);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') close();
        });

        document.querySelectorAll('.mermaid').forEach((el) => {
            el.addEventListener('click', () => {
                const svg = el.querySelector('svg');
                if (!svg) return;
                const clone = svg.cloneNode(true);
                clone.removeAttribute('style');
                clone.removeAttribute('width');
                clone.removeAttribute('height');
                body.innerHTML = '';
                body.appendChild(clone);
                modal.classList.add('open');
            });
        });
    </script>
{{ end }}
